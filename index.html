*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
.ic{flex:none;display:block}
#app{height:100dvh;display:flex;flex-direction:column;max-width:900px;margin:0 auto;position:relative}
#top{display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 10px) 10px 8px}
.icb{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--ink);flex:none}
.icb:active{background:var(--chip)}
.search{flex:1;display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:26px;padding:0 6px 0 14px;height:46px;box-shadow:var(--shadow);min-width:0}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;height:100%}
.search .icb{width:38px;height:38px}
.sdot{position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:50%;background:#999}
.sdot.ok{background:#2fb36b}.sdot.err{background:#e0584f}.sdot.run{background:#e0a72f;animation:pl 1s infinite}
@keyframes pl{50%{opacity:.3}}
#main{flex:1;overflow-y:auto;padding:4px 12px 110px;-webkit-overflow-scrolling:touch}
.fchips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none}
.fchips::-webkit-scrollbar{display:none}
.fchips{align-items:stretch;padding:4px 4px 16px}
.fchip{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:20px;padding:14px 16px;min-width:96px;max-width:170px;min-height:68px;box-shadow:0 6px 18px rgba(0,0,0,.22);flex:none;font-weight:700;font-size:15px;line-height:1.2;text-align:center;word-break:break-word;position:relative}
.fchip:active{transform:scale(.96)}
.fchip small{opacity:.75;font-weight:500;font-size:11.5px}
.fchip .pn{position:absolute;top:6px;right:8px;opacity:.8}
.fchip.add{color:var(--primary);background:var(--chip);box-shadow:none;flex-direction:row;gap:6px;min-width:0}
.fdot{width:14px;height:14px;border-radius:50%;flex:none}
.fhead{display:flex;align-items:center;gap:10px;padding:6px 2px}
.fhead h2{margin:0;flex:1;font-size:22px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;background:var(--chip);border-radius:14px;padding:4px;margin:6px 0 12px}
.tabs button{flex:1;padding:9px 6px;border-radius:11px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--primary-d);box-shadow:var(--shadow)}
.sec{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:10px 4px 8px}
.notes.grid{columns:2;column-gap:10px}
.notes.list{display:block}
.card{break-inside:avoid;margin:0 0 10px;border-radius:16px;padding:12px 13px;background:var(--n0);border:1px solid var(--line);box-shadow:var(--shadow);cursor:pointer;position:relative;overflow:hidden;user-select:none;-webkit-user-select:none}
.card.sel{outline:3px solid var(--primary);outline-offset:-3px}
.card h4{margin:0 0 6px;font-size:16px;line-height:1.25;word-break:break-word}
.card p{margin:0;font-size:14px;line-height:1.4;color:var(--ink);opacity:.82;word-break:break-word;display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.card .meta{display:flex;gap:6px;align-items:center;margin-top:8px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.badge{background:var(--chip);color:var(--primary-d);border-radius:8px;padding:2px 7px;font-weight:600}
.card .pinm{position:absolute;top:8px;right:8px;color:var(--primary)}
.card .ck{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:none;place-items:center}
.card.sel .ck{display:grid}.card.sel .pinm{display:none}
.empty{text-align:center;color:var(--muted);padding:60px 20px}
.empty svg{opacity:.35;margin:0 auto 10px}
#fab{position:absolute;right:18px;bottom:calc(env(safe-area-inset-bottom) + 20px);width:60px;height:60px;border-radius:20px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.28);z-index:5}

#selTop .icb{color:var(--on-primary)}

#scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:29;display:none}
#scrim.on{display:block}
.dlogo{display:flex;align-items:center;gap:12px;padding:6px 8px 14px;font-size:21px;font-weight:700;color:var(--primary-d)}
.dlogo svg{width:42px;height:42px;border-radius:12px}
.ditem{display:flex;align-items:center;gap:16px;width:100%;padding:13px 16px;border-radius:26px;text-align:left;font-weight:600}
.ditem span.n{margin-left:auto;color:var(--muted);font-weight:500;font-size:13px}
.ditem.on{background:var(--chip);color:var(--primary-d)}
.dsec{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 4px;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
hr{border:0;border-top:1px solid var(--line);margin:10px 8px}
#editor,#settings{position:fixed;inset:0;background:var(--bg);z-index:20;display:none;flex-direction:column;max-width:900px;margin:0 auto}
#editor.on,#settings.on{display:flex}
.ed-top,.st-top{display:flex;align-items:center;gap:2px;padding:calc(env(safe-area-inset-top) + 8px) 8px 6px}
.ed-top .sp{flex:1}
#edTitle{border:0;outline:0;background:none;font-size:24px;font-weight:700;padding:6px 18px 2px;width:100%}
#edMeta{padding:0 18px 6px;font-size:12px;color:var(--muted)}
#edBody{flex:1;border:0;outline:0;background:none;resize:none;padding:6px 18px 20px;line-height:1.65;width:100%;min-height:0}
.ed-find{display:none;align-items:center;gap:6px;padding:6px 10px;background:var(--chip)}
.ed-find.on{display:flex}
.ed-find input{flex:1;min-width:0;border:0;outline:0;background:var(--surface);border-radius:20px;padding:8px 14px}
.ed-bot{display:flex;align-items:center;gap:4px;padding:6px 10px calc(env(safe-area-inset-bottom) + 6px);background:var(--surface);border-top:1px solid var(--line)}
.ed-bot .stat{flex:1;text-align:right;font-size:12px;color:var(--muted);padding-right:6px}
.st-body{flex:1;overflow-y:auto;padding:4px 16px 60px}

.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0}
.themes{display:flex;gap:10px;flex-wrap:wrap}

.tsw.on{border-color:var(--ink)}
.btn{background:var(--primary);color:var(--on-primary);border-radius:22px;padding:11px 18px;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.ghost{background:var(--chip);color:var(--primary-d)}
.btn.block{width:100%;margin-top:8px}
.btn.dng{background:#e0584f;color:#fff}
.inp,.sel{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);outline:0}
input[type=range]{width:100%;accent-color:var(--primary)}
#sheetHost{position:fixed;inset:0;z-index:50;display:none}
#sheetHost.on{display:block}
.scrim2{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:900px;margin:0 auto;background:var(--surface);border-radius:24px 24px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 16px);max-height:88dvh;overflow-y:auto;animation:up .2s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{margin:0 0 12px;font-size:18px}
.mlist button{display:flex;align-items:center;gap:16px;width:100%;padding:14px 8px;text-align:left;border-radius:12px}
.mlist button:active{background:var(--chip)}
.mlist .danger{color:#d64040}
.row{display:flex;gap:10px;margin-top:14px}.row.end{justify-content:flex-end;flex-wrap:wrap}
.lbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:9px 14px;border-radius:18px;background:var(--chip);font-weight:600;font-size:14px}
.chips button.on{background:var(--primary);color:var(--on-primary)}
.chk{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:14.5px}
.chk input{width:20px;height:20px;accent-color:var(--primary)}
.cpal{display:flex;gap:10px;flex-wrap:wrap}
.cpal button{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.frow{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:16px;padding:12px;margin-bottom:8px;box-shadow:var(--shadow)}
.frow .fi{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--chip);color:var(--primary-d);flex:none}
.frow .ft{flex:1;min-width:0}
.frow .ft b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .ft small{color:var(--muted)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%);background:#16324a;color:#fff;padding:11px 18px;border-radius:22px;z-index:99;font-size:14px;max-width:88vw;opacity:0;pointer-events:none;transition:opacity .25s;text-align:center}
#toast.on{opacity:1}
.hint{font-size:12px;color:var(--muted);padding:2px 4px 8px}
</style>

const lum=h=>{const m=/^#?([0-9a-f]{6})$/i.exec(h);if(!m)return 1;const n=parseInt(m[1],16),r=n>>16,g=n>>8&255,b=n&255;return(0.299*r+0.587*g+0.114*b)/255};

let db;
const openDB=()=>new Promise((res,rej)=>{const r=indexedDB.open('notdefteri',1);r.onupgradeneeded=()=>{const d=r.result;['notes','folders','files'].forEach(n=>d.createObjectStore(n,{keyPath:'id'}));d.createObjectStore('blobs')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const st=(s,m)=>db.transaction(s,m||'readonly').objectStore(s);
const rq=q=>new Promise((res,rej)=>{q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
const idbAll=s=>rq(st(s).getAll());
const idbPut=(s,v,k)=>rq(k===undefined?st(s,'readwrite').put(v):st(s,'readwrite').put(v,k));
const idbGet=(s,k)=>rq(st(s).get(k));
const idbDel=(s,k)=>rq(st(s,'readwrite').delete(k));

let view={scope:'all',folderId:null,tab:'notes'};
let q='',selecting=false,sel=new Set();
const folderById=id=>folders.find(f=>f.id===id&&!f.deleted);
const putNote=n=>{n.updated=Date.now();idbPut('notes',n);syncSoon()};
const putFolder=f=>{f.updated=Date.now();idbPut('folders',f);syncSoon()};
const putFile=f=>{f.updated=Date.now();idbPut('files',f);syncSoon()};

let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600)}
let sheetCancel=null;
function sheet(html,mount){const h=$('#sheetHost');h.innerHTML=`<div class="scrim2" data-close></div><div class="sheet">${html}</div>`;h.classList.add('on');h.onclick=e=>{if(e.target.hasAttribute('data-close')){const c=sheetCancel;closeSheet();c&&c()}};if(mount)mount(h.querySelector('.sheet'))}
function closeSheet(){sheetCancel=null;const h=$('#sheetHost');h.classList.remove('on');h.innerHTML=''}
function menu(title,items){sheet((title?`<h3>${esc(title)}</h3>`:'')+`<div class="mlist">${items.map((it,i)=>`<button data-i="${i}" class="${it.danger?'danger':''}">${it.ic?ic(it.ic,22):''}<span>${esc(it.label)}</span></button>`).join('')}</div>`,s=>s.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{closeSheet();items[+b.dataset.i].fn()}))}
function ask(title,val,ph){return new Promise(res=>{sheet(`<h3>${esc(title)}</h3><input id="askIn" class="inp" value="${esc(val||'')}" placeholder="${esc(ph||'')}"><div class="row end"><button class="btn ghost" id="askNo">Vazgeç</button><button class="btn" id="askOk">Tamam</button></div>`,s=>{const i=s.querySelector('#askIn');setTimeout(()=>{i.focus();i.select()},60);sheetCancel=()=>res(null);const ok=()=>{closeSheet();res(i.value.trim())};s.querySelector('#askOk').onclick=ok;s.querySelector('#askNo').onclick=()=>{closeSheet();res(null)};i.onkeydown=e=>{if(e.key==='Enter')ok()}})})}
function confirmBox(msg,label){return new Promise(res=>{sheet(`<h3>${esc(msg)}</h3><div class="row end"><button class="btn ghost" id="cNo">Vazgeç</button><button class="btn dng" id="cOk">${esc(label||'Sil')}</button></div>`,s=>{sheetCancel=()=>res(false);s.querySelector('#cOk').onclick=()=>{closeSheet();res(true)};s.querySelector('#cNo').onclick=()=>{closeSheet();res(false)}})})}
function pickFolder(title,cb,allowNone){const fs=folders.filter(f=>!f.deleted).sort((a,b)=>a.name.localeCompare(b.name,'tr'));menu(title,[...(allowNone?[{ic:'notes',label:'Klasörsüz',fn:()=>cb(null)}]:[]),...fs.map(f=>({ic:'folder',label:f.name,fn:()=>cb(f.id)})),{ic:'add',label:'Yeni klasör…',fn:async()=>{const n=await ask('Yeni klasör adı','','Örn. Destanlaşan Hayatlar');if(n){const f=newFolder(n);cb(f.id)}}}])}

/* ============ Klasör işlemleri ============ */
function newFolder(name){const f={id:uid(),name,color:folders.filter(x=>!x.deleted).length%8,pinned:false,created:Date.now(),updated:Date.now()};folders.push(f);putFolder(f);return f}
const countIn=id=>notes.filter(n=>!n.deleted&&n.state==='active'&&n.folderId===id).length;

/* ============ Çizim ============ */
function sortList(l){const k=S.sort;return l.sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)||(k==='title'?(a.title||'').localeCompare(b.title||'','tr'):k==='created'?b.created-a.created:b.updated-a.updated))}
function visibleNotes(){let l=notes.filter(n=>!n.deleted);
 if(q){const t=q.toLocaleLowerCase('tr');l=l.filter(n=>n.state!=='trash'&&((n.title||'')+' '+n.body).toLocaleLowerCase('tr').includes(t))}
 else if(view.scope==='archive')l=l.filter(n=>n.state==='archive');
 else if(view.scope==='trash')l=l.filter(n=>n.state==='trash');
 else{l=l.filter(n=>n.state==='active');if(view.scope==='folder')l=l.filter(n=>n.folderId===view.folderId)}
 return sortList(l)}
function cardHtml(n){const f=n.folderId&&folderById(n.folderId);const showF=f&&view.scope!=='folder';
 return `<div class="card ${sel.has(n.id)?'sel':''}" data-act="note" data-id="${n.id}" style="background:${NC[n.color||0]}">${n.pinned?`<span class="pinm">${ic('pin',16)}</span>`:''}<span class="ck">${ic('check',16)}</span>${n.title?`<h4>${esc(n.title)}</h4>`:''}<p>${esc(n.body.slice(0,400))}</p><div class="meta">${showF?`<span class="badge">${esc(f.name)}</span>`:''}<span>${fdate(n.updated)}</span></div></div>`}
function renderMain(){const m=$('#main');let h='';const searching=!!q;
 if(searching)h+=`<div class="sec">Arama sonuçları</div>`;
 else if(view.scope==='folder'){const f=folderById(view.folderId);if(!f){view={scope:'all',folderId:null,tab:'notes'};return renderMain()}
  const nf=files.filter(x=>!x.deleted&&x.folderId===f.id).length;
  h+=`<div class="fhead"><div class="fdot" style="background:${fcol(f)}"></div><h2>${esc(f.name)}</h2><button class="icb" data-act="fmenu">${ic('more')}</button></div><div class="tabs"><button class="${view.tab==='notes'?'on':''}" data-act="tab" data-v="notes">Notlar (${countIn(f.id)})</button><button class="${view.tab==='files'?'on':''}" data-act="tab" data-v="files">Dosyalar (${nf})</button></div>`;
  if(view.tab==='files'){m.innerHTML=h+renderFiles(f);return}}
 else if(view.scope==='all'){h+=backupBanner();const fs=folders.filter(f=>!f.deleted).sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)||a.name.localeCompare(b.name,'tr'));
  h+=`<div class="fchips">${fs.map(f=>`<button class="fchip" data-act="folder" data-id="${f.id}" style="${chipStyle(f)}">${f.pinned?`<span class="pn">${ic('pin',13)}</span>`:''}<span>${esc(f.name)}</span><small>${countIn(f.id)} not</small></button>`).join('')}<button class="fchip add" data-act="newfolder">${ic('add',18)} Klasör</button></div>`}
 else if(view.scope==='archive')h+=`<div class="fhead"><h2>Arşiv</h2></div>`;
 else if(view.scope==='trash'){h+=`<div class="fhead"><h2>Çöp kutusu</h2><button class="btn ghost" data-act="empty">Boşalt</button></div><div class="hint">Çöp kutusundaki notlar kendiliğinden silinmez; yalnızca siz silerseniz silinir.</div>`}
 const l=visibleNotes();
 if(!l.length)h+=`<div class="empty">${ic('notes',64)}<div>${searching?'Sonuç bulunamadı':view.scope==='trash'?'Çöp kutusu boş':view.scope==='archive'?'Arşiv boş':'Henüz not yok.<br>Sağ alttaki + ile başlayın.'}</div></div>`;
 else{const act=!searching&&['all','folder'].includes(view.scope);const pn=act?l.filter(n=>n.pinned):[];const on=act?l.filter(n=>!n.pinned):l;
  if(pn.length)h+=`<div class="sec">Sabitlenenler</div><div class="notes ${S.layout}">${pn.map(cardHtml).join('')}</div>`;
  if(on.length){if(pn.length)h+=`<div class="sec">Diğerleri</div>`;h+=`<div class="notes ${S.layout}">${on.map(cardHtml).join('')}</div>`}}
 m.innerHTML=h}
function backupBanner(){const last=S.lastBackup||0,ch=notes.some(n=>!n.deleted&&n.updated>last);if(!ch||Date.now()-last<2*864e5||!notes.some(n=>!n.deleted))return '';
 const g=last?Math.floor((Date.now()-last)/864e5)+' gündür':'hiç';return `<div class="card2" style="display:flex;gap:12px;align-items:center;padding:12px 14px"><div style="flex:1;font-size:13.5px"><b>Yedek zamanı</b><br>Son yedeğinizden ${last?'bu yana '+g.replace(' gündür',' gün geçti'):'beri hiç yedek alınmadı'}. Yedek telefonunuzun İndirilenler klasörüne kaydedilir.</div><button class="btn" data-act="bk">Yedekle</button></div>`}
const KIND={icerik:'Kitap içeriği (PDF)',kapak:'Kapak (PDF)',diger:'Diğer dosyalar'};
function renderFiles(f){const l=files.filter(x=>!x.deleted&&x.folderId===f.id);
 if(!l.length)return `<div class="empty">${ic('file',64)}<div>Bu klasörde henüz dosya yok.<br>Biten kitabın içerik ve kapak PDF'lerini + ile yükleyin.</div></div>`;
 let h='';for(const k of Object.keys(KIND)){const g=l.filter(x=>x.kind===k).sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)||b.updated-a.updated);if(!g.length)continue;
  h+=`<div class="sec">${KIND[k]}</div>`+g.map(x=>`<div class="frow"><div class="fi">${ic('file')}</div><div class="ft" data-act="fopen" data-id="${x.id}"><b>${esc(x.name)}</b><small>${fsize(x.size)} · ${fdate(x.updated)}</small></div>${x.pinned?`<span style="color:var(--primary)">${ic('pin',18)}</span>`:''}<button class="icb" data-act="fmore" data-id="${x.id}">${ic('more')}</button></div>`).join('')}
 return h}
function renderDrawer(){const d=$('#drawer');const fs=folders.filter(f=>!f.deleted).sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)||a.name.localeCompare(b.name,'tr'));

 d.innerHTML=`<div class="dlogo">${LOGO}<span>Not Defteri</span></div>

async function deleteFolder(f){const nn=notes.filter(n=>!n.deleted&&n.folderId===f.id),ff=files.filter(x=>!x.deleted&&x.folderId===f.id);

 nn.forEach(n=>{n.state='trash';n.trashedAt=Date.now();n.folderId=null;putNote(n)});
 ff.forEach(delFileRec);const t={id:f.id,deleted:true,updated:Date.now()};folders[folders.findIndex(x=>x.id===f.id)]=t;idbPut('folders',t);syncSoon();go({scope:'all'});toast('Klasör silindi')}

  const l=new DataView(new ArrayBuffer(30));l.setUint32(0,0x04034b50,true);l.setUint16(4,20,true);l.setUint16(6,0x0800,true);l.setUint16(10,time,true);l.setUint16(12,date,true);l.setUint32(14,crc,true);l.setUint32(18,data.length,true);l.setUint32(22,data.length,true);l.setUint16(26,nm.length,true);

  central.push(c.buffer,nm);off+=30+nm.length+data.length}
 let cs=0;central.forEach(x=>cs+=x.byteLength);const en=new DataView(new ArrayBuffer(22));en.setUint32(0,0x06054b50,true);en.setUint16(8,entries.length,true);en.setUint16(10,entries.length,true);en.setUint32(12,cs,true);en.setUint32(16,off,true);

async function parseDocx(buf){const z=await readZip(buf);const e=z.entries.find(x=>x.name==='word/document.xml');if(!e)throw new Error('Geçersiz Word dosyası');
 const doc=new DOMParser().parseFromString(new TextDecoder().decode(await z.read(e)),'application/xml');const out=[];
 for(const p of doc.getElementsByTagNameNS('*','p')){let t='';const walk=nd=>{for(const c of nd.childNodes){const ln=c.localName;if(ln==='t')t+=c.textContent;else if(ln==='tab')t+='\t';else if(ln==='br')t+='\n';else if(c.childNodes&&c.childNodes.length)walk(c)}};walk(p);if(t.trim())out.push(t)}
 return out.join('\n\n')}

async function renderNotes(ns,fmt,indent){
 if(fmt==='docx')return docxBlob(ns,indent);
 if(fmt==='md')return new Blob([ns.map(n=>(n.title?'# '+n.title+'\n\n':'')+n.body).join('\n\n---\n\n')],{type:'text/markdown;charset=utf-8'});
 if(fmt==='html')return new Blob([htmlDoc(ns,indent,false)],{type:'text/html;charset=utf-8'});
 return new Blob([ns.map(noteTxt).join('\n\n'+'─'.repeat(24)+'\n\n')],{type:'text/plain;charset=utf-8'})}
async function buildBackup(groups){const ns=[],fs=[],fo=new Map();
 for(const g of groups){if(g.folder)fo.set(g.folder.id,g.folder);g.notes.forEach(n=>{ns.push(n);if(n.folderId){const f=folderById(n.folderId);if(f)fo.set(f.id,f)}});(g.files||[]).forEach(f=>fs.push(f))}
 const data={app:'notdefteri',version:1,exported:Date.now(),folders:[...fo.values()],notes:ns,files:fs};
 const ent=[{name:'veri.json',data:new TextEncoder().encode(JSON.stringify(data))}];
 for(const f of fs){const b=await idbGet('blobs',f.id);if(b)ent.push({name:'dosyalar/'+f.id,data:b})}
 return makeZip(ent)}
async function runExport(groups,o){const d=todayStr(),fmt=o.fmt;const all=groups.flatMap(g=>g.notes);const hasF=o.withFiles&&groups.some(g=>(g.files||[]).length);
 if(!all.length&&!hasF){toast('Dışa aktarılacak not yok');return}
 if(fmt==='pdf'){if(o.share)toast('PDF için açılan ekranda "PDF olarak kaydet"i seçin; sonra dosyayı paylaşabilirsiniz');printHtml(htmlDoc(all,o.indent,true));return}
 const out=[];let zipName=(groups.length===1?safe(groups[0].name):'NotDefteri')+'_'+d+'.zip';
 if(fmt==='yedek'){S.lastBackup=Date.now();saveS();out.push({name:'NotDefteri_Yedek_'+d+'.zip',blob:await buildBackup(groups.map(g=>({...g,files:o.withFiles?g.files:[]})))})}
 else{const multi=groups.length>1||hasF;const ext=EXT[fmt];
  for(const g of groups){if(!g.notes.length&&!(o.withFiles&&(g.files||[]).length))continue;const base=safe(g.name),pre=multi?base+'/':'';
   if(o.mode==='one'){if(g.notes.length)out.push({name:`${pre}${base}_${d}.${ext}`,blob:await renderNotes(g.notes,fmt,o.indent)})}
   else{const used=new Set();for(const n of g.notes){let nm=safe(n.title||n.body.split('\n')[0].slice(0,50)||'Not'),k=nm,i=2;while(used.has(k.toLowerCase()))k=nm+' ('+i++ +')';used.add(k.toLowerCase());out.push({name:`${pre}${k}.${ext}`,blob:await renderNotes([n],fmt,o.indent)})}}
   if(o.withFiles)for(const f of g.files||[]){const b=await idbGet('blobs',f.id);if(b)out.push({name:`${pre}Dosyalar/${safe(f.name)}`,blob:b})}}}
 if(!out.length){toast('Dışa aktarılacak içerik yok');return}
 let fin=out;if(out.length>1||out[0].name.includes('/'))fin=[{name:zipName,blob:await makeZip(out.map(x=>({name:x.name,data:x.blob})))}];
 if(o.share)await shareFiles(fin);else{fin.forEach(f=>dl(f.name,f.blob));toast('İndirildi: '+fin[0].name)}}

async function mergeData(d,bl){bl=bl||{};let c=0;const L={folders,notes,files};
 for(const k of['folders','notes','files']){const idx=new Map(L[k].map((x,i)=>[x.id,i]));
  for(const it of(d[k]||[])){if(!it||!it.id)continue;const i=idx.get(it.id);
   if(i===undefined){L[k].push(it);idx.set(it.id,L[k].length-1);await idbPut(k,it);c++}
   else if((it.updated||0)>(L[k][i].updated||0)){L[k][i]=it;await idbPut(k,it);c++}
   else if(k==='files'&&!it.deleted&&bl[it.id]&&!await idbGet('blobs',it.id)){}
   if(k==='files'){if(it.deleted)await idbDel('blobs',it.id);else if(bl[it.id])await idbPut('blobs',bl[it.id],it.id)}}}
 return c}
async function importFiles(fl,fid){let created=0,merged=0,attached=0;
 for(const f of fl){const ext=(f.name.split('.').pop()||'').toLowerCase(),base=f.name.replace(/\.[^.]+$/,'');
  try{
   if(ext==='zip'){const z=await readZip(await f.arrayBuffer());const ve=z.entries.find(e=>e.name==='veri.json');
    if(ve){const data=JSON.parse(new TextDecoder().decode(await z.read(ve)));const bl={};for(const e of z.entries)if(e.name.startsWith('dosyalar/')&&e.name.length>9)bl[e.name.slice(9)]=new Blob([await z.read(e)]);merged+=await mergeData(data,bl)}
    else for(const e of z.entries){const x=e.name.split('.').pop().toLowerCase();if(e.name.endsWith('/'))continue;if(['txt','md','docx','html','htm'].includes(x)){const bytes=await z.read(e);created+=await noteFromBytes(e.name.split('/').pop().replace(/\.[^.]+$/,''),x,bytes.buffer.slice(bytes.byteOffset,bytes.byteOffset+bytes.byteLength),fid)}}}
   else if(ext==='json'){const data=JSON.parse(await f.text());if(data.app==='notdefteri')merged+=await mergeData(data);else throw new Error('Tanınmayan JSON')}
   else if(['txt','md','markdown','html','htm','docx'].includes(ext))created+=await noteFromBytes(base,ext,await f.arrayBuffer(),fid);
   else if(fid){const r={id:uid(),folderId:fid,kind:ext==='pdf'?'icerik':'diger',name:f.name,type:f.type||'application/octet-stream',size:f.size,pinned:false,created:Date.now(),updated:Date.now()};await idbPut('blobs',f,r.id);files.push(r);putFile(r);attached++}
   else toast(f.name+': PDF/dosyalar bir klasöre eklenir; önce klasör açın')
  }catch(e){toast(f.name+' içe aktarılamadı: '+e.message)}}
 render();toast([created?created+' not eklendi':'',merged?merged+' kayıt birleştirildi':'',attached?attached+' dosya eklendi':''].filter(Boolean).join(' · ')||'İçe aktarılacak bir şey bulunamadı')}
async function noteFromBytes(title,ext,buf,fid){let body;
 if(ext==='docx')body=await parseDocx(buf);
 else{body=new TextDecoder('utf-8').decode(buf);if(ext==='html'||ext==='htm'){const d=new DOMParser().parseFromString(body.replace(/<br\s*\/?>/gi,'\n').replace(/<\/(p|div|h[1-6]|li)>/gi,'\n\n'),'text/html');body=d.body.textContent.replace(/\n{3,}/g,'\n\n').trim()}}
 const n={id:uid(),folderId:fid||null,title,body,color:0,pinned:false,state:'active',created:Date.now(),updated:Date.now()};notes.push(n);putNote(n);return 1}

 return new Promise((res,rej)=>{const c=google.accounts.oauth2.initTokenClient({client_id:S.clientId,scope:'https://www.googleapis.com/auth/drive.appdata',callback:r=>{if(r.error)return rej(new Error(r.error_description||r.error));gToken=r.access_token;gExp=Date.now()+(r.expires_in||3600)*1000;S.connected=true;saveS();res(gToken)},error_callback:er=>rej(new Error(er.type==='popup_closed'?'Giriş penceresi kapatıldı':(er.message||er.type||'Giriş hatası')))});
  c.requestAccessToken(interactive?{}:{prompt:''})})}
async function gf(url,opt){opt=opt||{};const t=await getToken(false);const r=await fetch(url,Object.assign({},opt,{headers:Object.assign({},opt.headers||{},{Authorization:'Bearer '+t})}));if(!r.ok)throw new Error('Drive '+r.status);return r}
async function gList(){let out=[],pt='';do{const r=await gf('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&pageSize=1000&fields=nextPageToken,files(id,name)'+(pt?'&pageToken='+pt:''));const j=await r.json();out=out.concat(j.files||[]);pt=j.nextPageToken}while(pt);return out}
async function gUp(name,blob,id){if(id){await gf('https://www.googleapis.com/upload/drive/v3/files/'+id+'?uploadType=media',{method:'PATCH',body:blob});return}
 const bd='nd'+uid();const body=new Blob(['--'+bd+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify({name,parents:['appDataFolder']})+'\r\n--'+bd+'\r\nContent-Type: application/octet-stream\r\n\r\n',blob,'\r\n--'+bd+'--']);
 await gf('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+bd},body})}
async function syncNow(interactive){if(syncing)return;syncing=true;setSyncState('run');
 try{await getToken(interactive);const remote=await gList();const map={};remote.forEach(f=>map[f.name]=f.id);
  if(map['veri.json']){const r=await gf('https://www.googleapis.com/drive/v3/files/'+map['veri.json']+'?alt=media');await mergeData(await r.json())}
  for(const f of files.slice()){const bn='blob_'+f.id;
   if(f.deleted){if(map[bn]){await gf('https://www.googleapis.com/drive/v3/files/'+map[bn],{method:'DELETE'});delete map[bn]}continue}
   const has=await idbGet('blobs',f.id);
   if(!has&&map[bn]){const r=await gf('https://www.googleapis.com/drive/v3/files/'+map[bn]+'?alt=media');await idbPut('blobs',await r.blob(),f.id)}
   else if(has&&!map[bn])await gUp(bn,has)}
  await gUp('veri.json',new Blob([JSON.stringify({app:'notdefteri',version:1,updated:Date.now(),folders,notes,files})],{type:'application/json'}),map['veri.json']);
  S.lastSync=Date.now();saveS();setSyncState('ok');if(!editorOpen)render();if(interactive)toast('Eşitlendi ✓')}
 catch(e){setSyncState('err',e.message);if(interactive)toast('Eşitleme hatası: '+e.message)}
 finally{syncing=false}}
function syncSoon(ms){if(!(S.clientId&&S.connected&&S.autosync))return;clearTimeout(syncT);syncT=setTimeout(()=>{if(!editorOpen||!dirty)syncNow(false);else syncSoon(4000)},ms||7000)}

(async function init(){
 applyTheme();
 try{db=await openDB()}catch(e){document.body.innerHTML='<p style="padding:24px">Tarayıcı depolaması açılamadı. Gizli sekmede olmadığınızdan emin olun.</p>';return}
 [folders,notes,files]=await Promise.all([idbAll('folders'),idbAll('notes'),idbAll('files')]);
 try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
 render();
 if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
 if(S.clientId&&S.connected)setTimeout(()=>syncNow(false),1500);
})();
</script>
